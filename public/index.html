<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawaiian Rummy - Multiplayer</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2">
    <script src="/socket.io/socket.io.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Mobile optimizations */
      @media (max-width: 768px) {
        /* Hide redundant visual deck/discard in center */
        .center-visual-cards {
          display: none !important;
        }

        /* Vertical stacking on mobile */
        .players-grid {
          display: flex !important;
          flex-direction: column !important;
          gap: 0.5rem !important;
          margin-bottom: 0.5rem !important;
        }

        /* Compact player info boxes */
        .player-info-box {
          padding: 0.5rem !important;
          font-size: 0.75rem !important;
        }

        .player-info-box h3 {
          font-size: 0.875rem !important;
          margin-bottom: 0.25rem !important;
        }

        /* Hide score and wins in player cards on mobile */
        .player-info-box .score-info {
          display: none !important;
        }

        /* Hide card backs on mobile - just show count */
        .player-card-backs {
          display: none !important;
        }

        /* Hide player's own hand info section on mobile */
        .player-hand-section {
          display: none !important;
        }

        /* Remove scrolling from melds on mobile - expand to show all */
        .player-melds {
          max-height: none !important;
          overflow-y: visible !important;
          font-size: 0.65rem !important;
        }

        .meld-card-mobile {
          padding: 0.125rem 0.25rem !important;
          font-size: 0.65rem !important;
        }

        /* Reduce game header padding */
        .game-header {
          padding: 0.5rem !important;
          margin-bottom: 0.5rem !important;
        }

        .game-header h1 {
          font-size: 1rem !important;
        }

        .game-header button {
          padding: 0.25rem 0.5rem !important;
          font-size: 0.75rem !important;
        }

        .game-header .goal-text {
          padding: 0.25rem !important;
          font-size: 0.7rem !important;
        }

        /* Compact discard/deck section */
        .discard-section {
          padding: 0.75rem !important;
          margin-bottom: 0.5rem !important;
        }

        .discard-section h2 {
          font-size: 1rem !important;
          margin-bottom: 0.5rem !important;
        }

        /* Make buy buttons smaller and wrap better */
        .buy-actions {
          gap: 0.25rem !important;
        }

        .buy-actions button {
          padding: 0.375rem 0.5rem !important;
          font-size: 0.7rem !important;
        }

        .buy-status {
          font-size: 0.7rem !important;
          padding: 0.375rem 0.5rem !important;
          margin-top: 0.25rem !important;
        }

        /* Compact hand section */
        .hand-section {
          padding: 0.75rem !important;
          margin-bottom: 0.5rem !important;
        }

        .hand-section h2 {
          font-size: 1rem !important;
          margin-bottom: 0.5rem !important;
        }

        /* Sort buttons on mobile */
        .sort-buttons button {
          padding: 0.25rem 0.5rem !important;
          font-size: 0.65rem !important;
        }

        /* Smaller cards on mobile */
        .card-mobile {
          width: 1.85rem !important;
          height: 2.65rem !important;
          padding: 0.2rem !important;
          display: flex !important;
          flex-direction: column !important;
          justify-content: space-between !important;
          align-items: center !important;
        }

        .card-mobile .rank-text {
          font-size: 0.6rem !important;
          margin-bottom: 0 !important;
        }

        .card-mobile .suit-text {
          font-size: 0.5rem !important;
          position: relative !important;
          bottom: auto !important;
        }

        /* Abbreviate WILD to W on mobile - ensure it stays inside card */
        .card-mobile .wild-indicator {
          position: relative !important;
          font-size: 0.4rem !important;
          bottom: auto !important;
          left: auto !important;
          right: auto !important;
          margin-top: 0.1rem !important;
        }

        /* Hide original WILD text and show W instead */
        .card-mobile .absolute.bottom-1 {
          position: relative !important;
          font-size: 0 !important;
          bottom: auto !important;
          left: auto !important;
          right: auto !important;
          margin-top: 0.1rem !important;
        }

        .card-mobile .absolute.bottom-1::before {
          content: 'W' !important;
          font-size: 0.4rem !important;
        }

        /* Enhanced dragging visual feedback on mobile */
        @media (max-width: 768px) {
          .card-mobile.opacity-50 {
            opacity: 0.3 !important;
          }

          .card-mobile.scale-95 {
            transform: scale(1.1) !important;
          }
        }

        /* More prominent drop indicator on mobile */
        @media (max-width: 768px) {
          .drop-indicator-mobile {
            width: 0.25rem !important;
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8) !important;
            box-shadow: 0 0 12px rgba(59, 130, 246, 1), 0 0 6px rgba(59, 130, 246, 0.8) !important;
          }
        }

        /* Compact hand actions */
        .hand-actions button {
          padding: 0.375rem 0.5rem !important;
          font-size: 0.7rem !important;
        }

        /* Reduce overall page padding */
        .main-container {
          padding: 0.5rem !important;
        }

        /* Sound controls - stack vertically on mobile */
        .sound-controls-mobile {
          flex-direction: column !important;
          gap: 0.5rem !important;
        }

        /* Mobile layout reorganization - use flexbox order */
        .mobile-layout-container {
          display: flex !important;
          flex-direction: column !important;
        }

        /* Order for mobile: discard/actions, hand, melds, scores, controls */
        .mobile-order-1 { order: 1; } /* Discard pile and action buttons at TOP */
        .mobile-order-2 { order: 2; } /* Your Hand section */
        .mobile-order-3 { order: 3; } /* All players melds */
        .mobile-order-4 { order: 4; } /* Player scores section */
        .mobile-order-5 { order: 5; } /* Volume control and How to Play button at BOTTOM */

        /* Scores section styling for mobile */
        .scores-section {
          padding: 0.75rem !important;
          margin-bottom: 0.5rem !important;
        }

        .scores-section h2 {
          font-size: 1rem !important;
          margin-bottom: 0.5rem !important;
        }

        .score-player {
          font-size: 0.75rem !important;
          padding: 0.5rem !important;
          margin-bottom: 0.25rem !important;
        }
      }

      /* Touch-friendly buttons - increase touch targets */
      @media (hover: none) and (pointer: coarse) {
        button {
          min-height: 44px !important;
          min-width: 44px !important;
          padding: 0.75rem 1rem !important;
        }

        .card-mobile {
          min-width: 30px !important;
          min-height: 42px !important;
        }

        /* Larger tap targets for interactive elements */
        input[type="range"] {
          height: 30px !important;
        }
      }

      /* Tablet landscape mode optimization */
      @media (min-width: 769px) and (max-width: 1024px) and (orientation: landscape) {
        .players-grid {
          grid-template-columns: repeat(4, 1fr) !important;
        }

        .center-visual-cards {
          grid-column: 2 / 4 !important;
        }

        .main-container {
          padding: 1rem !important;
        }
      }

      /* Card zoom overlay */
      .card-zoom-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        animation: fadeIn 0.2s ease-in;
      }

      .card-zoom-content {
        background: white;
        border: 4px solid #1f2937;
        border-radius: 1rem;
        padding: 2rem;
        width: 200px;
        height: 280px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        animation: zoomIn 0.2s ease-out;
      }

      .card-zoom-rank {
        font-size: 4rem !important;
        font-weight: bold;
      }

      .card-zoom-suit {
        font-size: 3rem !important;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes zoomIn {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      /* Collapsible sections */
      .collapsible-header {
        cursor: pointer;
        user-select: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .collapsible-indicator {
        transition: transform 0.3s ease;
      }

      .collapsible-indicator.collapsed {
        transform: rotate(-90deg);
      }

      .collapsible-content {
        max-height: 1000px;
        overflow: hidden;
        transition: max-height 0.3s ease, opacity 0.3s ease;
        opacity: 1;
      }

      .collapsible-content.collapsed {
        max-height: 0 !important;
        opacity: 0;
      }

      /* Animation keyframes */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
      }

      @keyframes cardDeal {
        0% {
          opacity: 0;
          transform: translateY(-300px) translateX(0px) scale(0.3) rotate(-20deg);
        }
        70% {
          opacity: 1;
          transform: translateY(20px) translateX(0px) scale(1.1) rotate(5deg);
        }
        100% {
          opacity: 1;
          transform: translateY(0) translateX(0) scale(1) rotate(0deg);
        }
      }

      @keyframes cardDiscard {
        0% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
        100% {
          opacity: 0;
          transform: translateY(-200px) scale(0.5) rotate(25deg);
        }
      }

      @keyframes meldSnap {
        0% { transform: scale(1); }
        40% { transform: scale(1.15) rotate(-3deg); }
        60% { transform: scale(1.15) rotate(3deg); }
        100% { transform: scale(1) rotate(0deg); }
      }

      @keyframes discardGlow {
        0%, 100% {
          box-shadow: 0 0 15px rgba(147, 51, 234, 0.6), 0 0 30px rgba(147, 51, 234, 0.4);
        }
        50% {
          box-shadow: 0 0 30px rgba(147, 51, 234, 1), 0 0 60px rgba(147, 51, 234, 0.8), 0 0 90px rgba(147, 51, 234, 0.6);
        }
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        25% { transform: translateX(-8px) rotate(-3deg); }
        50% { transform: translateX(8px) rotate(3deg); }
        75% { transform: translateX(-8px) rotate(-3deg); }
      }

      @keyframes confettiFall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) rotate(720deg);
          opacity: 0;
        }
      }

      .card-deal {
        animation: cardDeal 0.8s ease-out forwards;
      }

      .card-discard {
        animation: cardDiscard 0.5s ease-in forwards;
      }

      .meld-snap {
        animation: meldSnap 0.5s ease-out;
      }

      .discard-glow {
        animation: discardGlow 1.5s ease-in-out infinite;
      }

      .shake-effect {
        animation: shake 0.4s ease-in-out;
      }

      /* Layoff animation - card flies to meld */
      @keyframes layoffFly {
        0% {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
        50% {
          transform: scale(1.3) translateY(-30px);
          opacity: 0.8;
        }
        100% {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
      }

      .layoff-fly {
        animation: layoffFly 0.6s ease-in-out;
      }

      /* Meld highlight pulse for layoff target */
      @keyframes meldPulse {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
          background-color: transparent;
        }
        50% {
          box-shadow: 0 0 20px 5px rgba(34, 197, 94, 0.6);
          background-color: rgba(34, 197, 94, 0.1);
        }
      }

      .meld-pulse {
        animation: meldPulse 0.6s ease-in-out;
      }

      /* Confetti styles */
      .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        z-index: 9999;
        pointer-events: none;
      }

      .confetti-fall {
        animation: confettiFall 3s linear forwards;
      }

      /* Score count-up animation */
      @keyframes scoreCountUp {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.5);
          color: #22c55e;
        }
        100% {
          transform: scale(1);
        }
      }

      .score-count-up {
        animation: scoreCountUp 0.5s ease-out;
      }

      /* Card discard to pile animation */
      @keyframes discardToPile {
        0% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
        50% {
          transform: scale(1.2) rotate(10deg) translateY(-20px);
          opacity: 0.9;
        }
        100% {
          transform: scale(1) rotate(0deg) translateY(0);
          opacity: 1;
        }
      }

      .discard-to-pile {
        animation: discardToPile 0.5s ease-out;
      }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function HawaiianRummyMultiplayer() {
          const [socket, setSocket] = useState(null);
          const [gamePhase, setGamePhase] = useState('join'); // join, lobby, playing
          const [playerName, setPlayerName] = useState('');
          const [roomId, setRoomId] = useState('');
          const [lobbyPlayers, setLobbyPlayers] = useState([]);
          const [gameState, setGameState] = useState(null);
          const [selectedCards, setSelectedCards] = useState([]);
          const [message, setMessage] = useState('');
          const [draggedCardId, setDraggedCardId] = useState(null);
          const [dragOverCardId, setDragOverCardId] = useState(null);
          const [isDragging, setIsDragging] = useState(false);
          const [layoffMode, setLayoffMode] = useState(false);
          const [selectedMeld, setSelectedMeld] = useState(null);
          const [wildcardReplaceMode, setWildcardReplaceMode] = useState(false);
          const [selectedWildcard, setSelectedWildcard] = useState(null);
          const [showHowToPlay, setShowHowToPlay] = useState(false);
          const [wildcardPositionPrompt, setWildcardPositionPrompt] = useState(null);
          const [meldWildcardPositionPrompt, setMeldWildcardPositionPrompt] = useState(null);
          const [buyCountdown, setBuyCountdown] = useState(null);
          const buyCountdownRef = useRef(null);
          const [animatingCard, setAnimatingCard] = useState(null);
          const [turnOrderData, setTurnOrderData] = useState(null);
          const [turnOrderCountdown, setTurnOrderCountdown] = useState(null);
          const processedTurnOrderPhase = useRef(null);
          const [previousHandIds, setPreviousHandIds] = useState(new Set());
          const [newCardIds, setNewCardIds] = useState(new Set());
          const [animatingMeldIndex, setAnimatingMeldIndex] = useState(null);
          const [animatingLayoffMeld, setAnimatingLayoffMeld] = useState(null);
          const [showConfetti, setShowConfetti] = useState(false);
          const [discardAnimation, setDiscardAnimation] = useState(false);
          const [volume, setVolume] = useState(0.5); // 0 to 1
          const [isMuted, setIsMuted] = useState(false);
          const audioContextRef = useRef(null);

          // Mobile features state
          const [zoomedCard, setZoomedCard] = useState(null); // Card being zoomed/enlarged
          const [collapsedSections, setCollapsedSections] = useState({}); // Track collapsed sections
          const [touchStart, setTouchStart] = useState(null); // For swipe gesture detection
          const [lastTap, setLastTap] = useState(0); // For double-tap detection
          const [swipeDirection, setSwipeDirection] = useState(null); // Track swipe direction
          const [touchDraggedCardId, setTouchDraggedCardId] = useState(null); // Card being touch-dragged
          const [touchDragPosition, setTouchDragPosition] = useState(null); // Current touch position
          const [copiedFeedback, setCopiedFeedback] = useState(false); // Show "Copied!" feedback
          const [buyNotification, setBuyNotification] = useState(null); // Buy notification {type, message}
          const [dragOverDiscard, setDragOverDiscard] = useState(false); // Highlight discard pile when dragging over
          const [dragOverMeld, setDragOverMeld] = useState(null); // { playerId, meldIndex } when dragging over a meld

          const roundRequirements = [
            { sets: 2, setSizes: [3, 3], runs: 0, runSizes: [], description: "2 sets of 3" },
            { sets: 1, setSizes: [3], runs: 1, runSizes: [4], description: "1 set of 3 and a run of 4" },
            { sets: 0, setSizes: [], runs: 2, runSizes: [4, 4], description: "2 runs of 4" },
            { sets: 3, setSizes: [3, 3, 3], runs: 0, runSizes: [], description: "3 sets of 3" },
            { sets: 1, setSizes: [3], runs: 1, runSizes: [7], description: "1 set of 3 and a run of 7" },
            { sets: 2, setSizes: [3, 3], runs: 1, runSizes: [5], description: "2 sets of 3 and a run of 5" },
            { sets: 3, setSizes: [4, 4, 4], runs: 0, runSizes: [], description: "3 sets of 4" },
            { sets: 1, setSizes: [3], runs: 1, runSizes: [10], description: "1 set of 3 and a run of 10" },
            { sets: 3, setSizes: [3, 3, 3], runs: 1, runSizes: [5], description: "3 sets of 3 and a run of 5" },
            { sets: 0, setSizes: [], runs: 3, runSizes: [5, 5, 5], description: "3 runs of 5" }
          ];

          // Sound manager using Web Audio API
          const playSound = (type) => {
            if (isMuted) return;

            // Initialize AudioContext on first use
            if (!audioContextRef.current) {
              audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
            }

            const audioContext = audioContextRef.current;
            const gainNode = audioContext.createGain();
            gainNode.gain.value = volume;
            gainNode.connect(audioContext.destination);

            const now = audioContext.currentTime;

            switch (type) {
              case 'draw': {
                // Quick ascending beep for drawing a card
                const osc = audioContext.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                osc.connect(gainNode);
                osc.start(now);
                osc.stop(now + 0.1);
                break;
              }
              case 'discard': {
                // Quick descending beep for discarding
                const osc = audioContext.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
                osc.connect(gainNode);
                osc.start(now);
                osc.stop(now + 0.15);
                break;
              }
              case 'meld': {
                // Satisfying "snap" sound - multiple quick tones
                [440, 550, 660].forEach((freq, i) => {
                  const osc = audioContext.createOscillator();
                  osc.type = 'triangle';
                  osc.frequency.value = freq;
                  osc.connect(gainNode);
                  osc.start(now + i * 0.05);
                  osc.stop(now + i * 0.05 + 0.1);
                });
                break;
              }
              case 'layoff': {
                // Bright chime for layoff
                const osc = audioContext.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                osc.connect(gainNode);
                osc.start(now);
                osc.stop(now + 0.2);
                break;
              }
              case 'notification': {
                // Gentle notification chime - soft ascending tone
                const osc = audioContext.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(650, now + 0.3);
                osc.connect(gainNode);
                osc.start(now);
                osc.stop(now + 0.3);
                break;
              }
              case 'victory': {
                // Triumphant ascending fanfare
                const frequencies = [440, 554, 659, 880];
                frequencies.forEach((freq, i) => {
                  const osc = audioContext.createOscillator();
                  osc.type = 'triangle';
                  osc.frequency.value = freq;
                  osc.connect(gainNode);
                  osc.start(now + i * 0.15);
                  osc.stop(now + i * 0.15 + 0.3);
                });
                break;
              }
              case 'shuffle': {
                // Rapid noise burst for shuffle
                const bufferSize = audioContext.sampleRate * 0.3;
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                  data[i] = Math.random() * 2 - 1;
                }
                const noise = audioContext.createBufferSource();
                noise.buffer = buffer;
                const filter = audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 1000;
                noise.connect(filter);
                filter.connect(gainNode);
                noise.start(now);
                noise.stop(now + 0.3);
                break;
              }
              case 'countdownBeep': {
                // Short beep for countdown 3, 2, 1
                const osc = audioContext.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 800;
                osc.connect(gainNode);
                osc.start(now);
                osc.stop(now + 0.15);
                break;
              }
              case 'countdownFinal': {
                // Long beep for countdown 0
                const osc = audioContext.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 600;
                osc.connect(gainNode);
                osc.start(now);
                osc.stop(now + 0.45); // 3x longer than short beep
                break;
              }
            }
          };

          // Mobile utility functions

          // Card zoom handler - tap to enlarge card
          const handleCardTap = (card) => {
            setZoomedCard(card);
          };

          // Close zoomed card overlay
          const closeZoom = () => {
            setZoomedCard(null);
          };

          // Toggle collapsible section
          const toggleSection = (sectionId) => {
            setCollapsedSections(prev => ({
              ...prev,
              [sectionId]: !prev[sectionId]
            }));
          };

          // Copy room code to clipboard
          const copyRoomCode = async () => {
            try {
              await navigator.clipboard.writeText(roomId);
              setCopiedFeedback(true);
              setTimeout(() => setCopiedFeedback(false), 2000);
            } catch (err) {
              console.error('Failed to copy:', err);
            }
          };

          // Handle touch start for card dragging and reordering
          const handleCardTouchStart = (e, cardId) => {
            const touch = e.touches[0];
            setTouchStart({
              x: touch.clientX,
              y: touch.clientY,
              time: Date.now(),
              cardId: cardId
            });
            setTouchDraggedCardId(cardId);
            setTouchDragPosition({ x: touch.clientX, y: touch.clientY });
          };

          // Handle touch move for card dragging
          const handleCardTouchMove = (e, cardId) => {
            if (!touchStart || touchStart.cardId !== cardId) return;

            e.preventDefault(); // Prevent scrolling while dragging
            const touch = e.touches[0];
            setTouchDragPosition({ x: touch.clientX, y: touch.clientY });

            // Get all card elements in the hand
            const allCards = document.querySelectorAll('.card-mobile[data-card-id]');

            let closestCard = null;
            let closestDistance = Infinity;

            // Find the closest card based on both X and Y distance
            allCards.forEach(cardEl => {
              if (cardEl.dataset.cardId === cardId) return; // Skip the dragged card itself

              const rect = cardEl.getBoundingClientRect();
              const cardCenterX = rect.left + rect.width / 2;
              const cardCenterY = rect.top + rect.height / 2;

              // Calculate distance from touch point to card center
              const dx = touch.clientX - cardCenterX;
              const dy = touch.clientY - cardCenterY;
              const distance = Math.sqrt(dx * dx + dy * dy);

              if (distance < closestDistance) {
                closestDistance = distance;
                closestCard = cardEl;
              }
            });

            if (closestCard && closestDistance < 100) { // Only update if within reasonable distance
              setDragOverCardId(closestCard.dataset.cardId);
            }
          };

          // Handle touch end for card drop and reordering
          const handleCardTouchEnd = (e, cardId) => {
            if (!touchStart) return;

            const touchEnd = {
              x: e.changedTouches[0].clientX,
              y: e.changedTouches[0].clientY,
              time: Date.now()
            };

            const deltaX = touchEnd.x - touchStart.x;
            const deltaY = touchEnd.y - touchStart.y;
            const deltaTime = touchEnd.time - touchStart.time;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            // If moved significantly, treat as drag/reorder (reduced threshold from 30px to 15px for easier dragging on mobile)
            if (distance > 15 && touchStart.cardId === cardId) {
              // Find target card at drop position
              const elements = document.elementsFromPoint(touchEnd.x, touchEnd.y);
              const targetElement = elements.find(el =>
                el.classList.contains('card-mobile') &&
                el.dataset.cardId &&
                el.dataset.cardId !== cardId

                const draggedIndex = hand.findIndex(c => c.id === cardId);
                const targetIndex = hand.findIndex(c => c.id === dragOverCardId);
