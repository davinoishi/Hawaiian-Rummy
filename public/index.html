                              {copiedFeedback ? 'Copied!' : 'Copy Code'}
                            </button>
                            <div className="text-xs text-gray-500 mt-2">Share this code with friends!</div>
                          </div>
                        </div>
                      )}

                      {/* Player List */}
                      <div className="mb-6">
                        <h2 className="text-2xl font-bold mb-4 text-center text-gray-800">
                          Players ({lobbyPlayers.length}/4):
                        </h2>
                        <div className="space-y-2">
                          {lobbyPlayers.map((player) => (
                            <div
                              key={player.id}
                              className="bg-blue-50 rounded-lg p-3 text-center text-lg font-semibold text-gray-700"
                            >
                              {player.name}
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Buttons */}
                      <div className="space-y-3">
                        <button
                          onClick={startGame}
                          disabled={lobbyPlayers.length < 1}
                          className="w-full py-3 px-6 rounded-lg font-semibold text-white transform hover:scale-105 transition-transform disabled:opacity-50 disabled:cursor-not-allowed"
                          style={{
                            background: lobbyPlayers.length >= 1
                              ? 'linear-gradient(135deg, #FF6B6B 0%, #FFB347 100%)'
                              : 'linear-gradient(135deg, #999 0%, #666 100%)'
                          }}
                        >
                          Start Game
                        </button>

                        <button
                          onClick={() => setShowHowToPlay(true)}
                          className="w-full py-3 px-6 rounded-lg font-semibold text-white transform hover:scale-105 transition-transform"
                          style={{background: 'linear-gradient(135deg, #4FACFE 0%, #00F2FE 100%)'}}
                        >
                          How to Play
                        </button>
                      </div>

                      {/* Status message */}
                      <p className="mt-6 text-center text-gray-600 font-medium">
                        {lobbyPlayers.length < 1
                          ? 'Waiting for players...'
                          : 'Ready to start!'
                        }
                      </p>
                    </div>
                  </div>

                  {/* CSS Animations */}
                  <style>{`
                    @keyframes wave {
                      0%, 100% { transform: translateY(0); }
                      50% { transform: translateY(-10px); }
                    }
                    @keyframes pulse {
                      0%, 100% { transform: scale(1); opacity: 1; }
                      50% { transform: scale(1.05); opacity: 0.9; }
                    }
                    @keyframes fadeIn {
                      from { opacity: 0; transform: translateY(20px); }
                      to { opacity: 1; transform: translateY(0); }
                    }
                    @keyframes fadeInScale {
                      from { opacity: 0; transform: scale(0.8); }
                      to { opacity: 1; transform: scale(1); }
                    }
                  `}</style>
                </div>
              </>
            );
          }

          // Turn Order Countdown screen
          if (turnOrderCountdown !== null) {
            return (
              <div className="min-h-screen relative overflow-hidden">
                {/* Sunset Background */}
                <div className="absolute inset-0" style={{
                  background: 'linear-gradient(to bottom, #FF6B9D 0%, #FFA07A 25%, #FFD700 50%, #87CEEB 75%, #4682B4 100%)'
                }}></div>

                {/* Content */}
                <div className="relative z-10 flex items-center justify-center min-h-screen">
                  <div className="text-center">
                    <div className="text-9xl font-bold text-white mb-8" style={{textShadow: '4px 4px 8px rgba(0,0,0,0.5)'}}>
                      {turnOrderCountdown}
                    </div>
                    <div className="text-4xl text-white font-semibold" style={{textShadow: '2px 2px 4px rgba(0,0,0,0.5)'}}>
                      Starting game...
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          // Turn Order screen (random selection)
          if (turnOrderData) {
            const positions = [1, 2, 3, 4];

            let message = '';
            if (turnOrderData.phase === 'selecting') {
              if (turnOrderData.position === 0) {
                message = 'Randomly selecting turn order...';
              } else {
                message = `Selecting position ${turnOrderData.position}...`;
              }
            } else if (turnOrderData.phase === 'final') {
              message = 'Turn order determined!';
            }

            return (
              <div className="min-h-screen relative overflow-hidden">
                {/* Sunset Background */}
                <div className="absolute inset-0" style={{
                  background: 'linear-gradient(to bottom, #FF6B9D 0%, #FFA07A 25%, #FFD700 50%, #87CEEB 75%, #4682B4 100%)'
                }}></div>

                {/* Sun */}
                <div className="absolute" style={{
                  top: '15%',
                  left: '50%',
                  transform: 'translateX(-50%)',
                  width: '120px',
                  height: '120px',
                  borderRadius: '50%',
                  background: 'radial-gradient(circle, #FFF4E6, #FFD700)',
                  boxShadow: '0 0 80px rgba(255, 215, 0, 0.6)'
                }}></div>

                {/* Content */}
                <div className="relative z-10 flex items-center justify-center min-h-screen p-4">
                  <div className="bg-white rounded-lg shadow-2xl p-8 max-w-4xl w-full" style={{backgroundColor: 'rgba(255, 255, 255, 0.95)'}}>
                    <h1 className="text-4xl font-bold mb-4 text-center text-gray-800">
                      Determining Turn Order
                    </h1>
                    <p className="text-xl text-center mb-8 text-gray-600">{message}</p>

                    {/* Position Slots */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                      {positions.map(pos => {
                        const selected = turnOrderData.selectedOrder?.find(p => p.position === pos);
                        const isJustSelected = selected && turnOrderData.justSelected === selected.playerId;

                        return (
                          <div
                            key={pos}
                            className={`p-4 rounded-lg border-4 text-center transition-all ${
                              selected
                                ? isJustSelected
                                  ? 'border-green-500 bg-green-100 animate-pulse'
                                  : pos === 1
                                    ? 'border-yellow-500 bg-yellow-50'
                                    : 'border-blue-500 bg-blue-50'
                                : 'border-gray-300 bg-gray-100'
                            }`}
                          >
                            <div className="text-3xl font-bold text-gray-400 mb-2">
                              {pos === 1 ? '1st' : pos === 2 ? '2nd' : pos === 3 ? '3rd' : '4th'}
                            </div>
                            {selected ? (
                              <div className={`text-lg font-bold ${pos === 1 ? 'text-yellow-700' : 'text-blue-700'}`}>
                                {selected.name}
                                {pos === 1 && <span className="ml-1">👑</span>}
                              </div>
                            ) : (
                              <div className="text-lg text-gray-400">—</div>
                            )}
                          </div>
                        );
                      })}
                    </div>

                    {/* Remaining Players Pool */}
                    {turnOrderData.remainingPlayers && turnOrderData.remainingPlayers.length > 0 && (
                      <div className="mt-6">
                        <h3 className="text-lg font-semibold text-center text-gray-600 mb-3">Remaining Players</h3>
                        <div className="flex flex-wrap justify-center gap-3">
                          {turnOrderData.remainingPlayers.map(player => (
                            <div
                              key={player.playerId}
                              className="px-4 py-2 bg-gray-200 rounded-lg text-gray-700 font-medium"
                            >
                              {player.name}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {turnOrderData.phase === 'final' && (
                      <div className="mt-6 text-center text-gray-600">
                        <p className="text-lg">Starting game...</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          }

          // Playing screen
          if (!gameState) return <div>Loading...</div>;

          // Round Summary screen
          if (gameState.gamePhase === 'roundSummary') {
            const sortedPlayers = [...gameState.players].sort((a, b) => a.score - b.score);

            return (
              <div className="min-h-screen bg-green-800 flex items-center justify-center p-4">
                {/* Confetti Container */}
                <div id="confetti-container"></div>
                <div className={`bg-white rounded-lg shadow-lg p-8 max-w-5xl w-full ${showConfetti ? 'shake-effect' : ''}`}>
                  <h1 className="text-4xl font-bold mb-6 text-center">Round {gameState.currentRound + 1} Complete!</h1>

                  <div className="mb-6">
                    <h2 className="text-2xl font-bold mb-4">Current Rankings:</h2>
                    <div className="space-y-2">
                      {sortedPlayers.map((player, idx) => (
                        <div
                          key={player.id}
                          className={`p-4 rounded ${
                            idx === 0
                              ? 'bg-yellow-100 border-2 border-yellow-500'
                              : 'bg-gray-100'
                          }`}
                        >
                          <div className="flex justify-between items-center">
                            <div>
                              <span className="font-bold text-lg">
                                {idx + 1}. {player.name}
                                {idx === 0 && ' 🏆'}
                              </span>
                            </div>
                            <div className="text-xl font-bold">{player.score} points</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="mb-6 overflow-x-auto">
                    <h2 className="text-2xl font-bold mb-4">Scores by Round:</h2>
                    <table className="w-full border-collapse border border-gray-300">
                      <thead className="bg-gray-100">
                        <tr>
                          <th className="border border-gray-300 p-2 text-left">Player</th>
                          {Array.from({length: gameState.currentRound + 1}, (_, i) => (
                            <th key={i} className="border border-gray-300 p-2 text-center">R{i + 1}</th>
                          ))}
                          <th className="border border-gray-300 p-2 text-center font-bold">Total</th>
                        </tr>
                      </thead>
                      <tbody>
                        {sortedPlayers.map(player => (
                          <tr key={player.id}>
                            <td className="border border-gray-300 p-2 font-semibold">{player.name}</td>
                            {player.roundScores.map((score, idx) => (
                              <td key={idx} className="border border-gray-300 p-2 text-center">
                                {score}
                              </td>
                            ))}
                            <td className="border border-gray-300 p-2 text-center font-bold bg-gray-50">
                              {player.score}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="mb-4">
                    {gameState.hasContinued ? (
                      <div className="p-4 bg-green-100 rounded text-center">
                        <p className="font-semibold text-green-800">
                          ✓ You're ready! Waiting for other players...
                        </p>
                        <p className="text-sm mt-2 text-gray-600">
                          {gameState.continueClicked.length} of {gameState.players.length} players ready
                        </p>
                      </div>
                    ) : (
                      <button
                        onClick={() => socket.emit('continueToNextRound')}
                        className="w-full bg-blue-600 text-white px-6 py-3 rounded text-lg hover:bg-blue-700"
                      >
                        Continue to Round {gameState.currentRound + 2}
                      </button>
                    )}
                  </div>

                  {gameState.continueClicked.length > 0 && !gameState.hasContinued && (
                    <p className="text-center text-sm text-gray-600">
                      {gameState.continueClicked.length} of {gameState.players.length} players ready
                    </p>
                  )}
                </div>
              </div>
            );
          }

          // Game over screen
          if (gameState.gamePhase === 'gameOver') {
            const winner = gameState.players.find(p => p.id === gameState.winner);
            return (
              <div className="min-h-screen bg-green-800 flex items-center justify-center p-4">
                <div className="bg-white rounded-lg shadow-lg p-8 max-w-2xl w-full">
                  <h1 className="text-4xl font-bold mb-6 text-center">Game Over!</h1>
                  
                  {gameState.isWinner && (
                    <div className="text-3xl text-center mb-6 text-green-600 font-bold">
                      🎉 You Won! 🎉
                    </div>
                  )}
                  
                  <div className="mb-6">
                    <h2 className="text-2xl font-bold mb-4">Final Scores:</h2>
                    <div className="space-y-2">
                      {gameState.players
                        .sort((a, b) => a.score - b.score)
                        .map((player, idx) => (
                          <div 
                            key={player.id} 
                            className={`p-4 rounded ${
                              player.id === gameState.winner 
                                ? 'bg-green-100 border-2 border-green-500' 
                                : 'bg-gray-100'
                            }`}
                          >
                            <div className="flex justify-between items-center">
                              <div>
                                <span className="font-bold text-lg">
                                  {idx + 1}. {player.name}
                                  {player.id === gameState.winner && ' 👑'}
                                </span>
                              </div>
                              <div className="text-right">
                                <div className="text-xl font-bold">{player.score} points</div>
                                <div className="text-sm text-gray-600">{player.roundsWon} rounds won</div>
                              </div>
                            </div>
                          </div>
                        ))}
                    </div>
                  </div>
                  
                  <button
                    onClick={() => socket.emit('newGame')}
                    className="w-full bg-blue-600 text-white px-6 py-3 rounded text-lg hover:bg-blue-700"
                  >
                    Play Again
                  </button>
                </div>
              </div>
            );
          }

          return (
            <>
              <WildcardPositionModal />
              <MeldWildcardPositionModal />
              <HowToPlayModal />
              <CardZoomModal />
              <div className="min-h-screen bg-green-800 p-4 main-container">
                <div className="max-w-7xl mx-auto mobile-layout-container">
                {/* Players info with cards and melds - Arranged clockwise with center */}
                <div className="grid grid-cols-3 gap-4 mb-4 players-grid mobile-order-3" style={{ gridTemplateRows: 'auto auto auto' }}>
                  {/* Center area for visual deck and discard pile */}
                  <div className="col-start-2 row-start-2 flex flex-col items-center justify-center gap-2 p-4 center-visual-cards relative">
                    {/* Buy Notification Toast - positioned over center area */}
                    {buyNotification && (
                      <div className={`absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 px-6 py-3 rounded-lg shadow-2xl text-white font-semibold text-base animate-pulse ${
                        buyNotification.type === 'granted' ? 'bg-green-600' :
                        buyNotification.type === 'denied' ? 'bg-red-600' :
                        'bg-blue-600'
                      }`}>
                        {buyNotification.message}
                      </div>
                    )}

                    {/* Round Indicator */}
                    <div className="text-sm font-bold text-white bg-blue-600 px-3 py-1 rounded">
                      Round {gameState.currentRound + 1}/10
                    </div>

                    {/* Deck and Discard Pile */}
                    <div className="flex items-center justify-center gap-4">
                      {/* Visual Discard Pile */}
                      <div className="relative">
                        {gameState.discardPile.length > 0 ? (
                          <div
                            onClick={gameState.canTakeDiscard ? takeDiscard : undefined}
                            onDragOver={handleDiscardDragOver}
                            onDragEnter={handleDiscardDragEnter}
                            onDragLeave={handleDiscardDragLeave}
                            onDrop={handleDiscardDrop}
                            className={`bg-white border-2 rounded p-3 w-20 h-28 text-center shadow-lg flex flex-col items-center justify-center ${discardAnimation ? 'discard-to-pile' : ''} ${
                              gameState.canTakeDiscard ? 'cursor-pointer hover:ring-4 hover:ring-blue-400 hover:scale-105' : ''
                            } ${
                              dragOverDiscard ? 'ring-4 ring-red-500 border-red-500 scale-105' : 'border-gray-800'
                            }`}
                            style={{
                              transform: animatingCard?.type === 'discard' ? 'scale(1.1)' : 'scale(1)',
                              transition: discardAnimation ? 'none' : 'transform 0.3s ease-in-out'
                            }}
                            title={draggedCardId ? 'Drop to discard' : (gameState.canTakeDiscard ? 'Click to take discard' : '')}
                          >
                            <div className={`text-2xl font-bold ${getCardColor(gameState.discardPile[gameState.discardPile.length - 1].suit)}`}>
                              {gameState.discardPile[gameState.discardPile.length - 1].rank}
                            </div>
                            <div className={`text-xl ${getCardColor(gameState.discardPile[gameState.discardPile.length - 1].suit)}`}>
                              {gameState.discardPile[gameState.discardPile.length - 1].suit}
                            </div>
                          </div>
                        ) : (
                          <div
                            onDragOver={handleDiscardDragOver}
                            onDragEnter={handleDiscardDragEnter}
                            onDragLeave={handleDiscardDragLeave}
                            onDrop={handleDiscardDrop}
                            className={`w-20 h-28 border-2 border-dashed rounded flex items-center justify-center text-xs ${
                              dragOverDiscard ? 'border-red-500 bg-red-50 ring-4 ring-red-400' : 'border-gray-300 text-gray-400'
                            }`}
                            title={draggedCardId ? 'Drop to discard' : ''}
                          >
                            Discard
                          </div>
                        )}
                      </div>

                      {/* Visual Deck */}
                      <div className="relative">
                        <div
                          onClick={gameState.canDraw ? drawCard : undefined}
                          className={`bg-blue-900 text-white rounded p-3 w-20 h-28 text-center flex flex-col items-center justify-center shadow-lg ${
                            gameState.canDraw ? 'cursor-pointer hover:ring-4 hover:ring-blue-400 hover:scale-105' : 'opacity-50'
                          }`}
                          style={{
                            transform: animatingCard?.type === 'draw' ? 'scale(1.1)' : 'scale(1)',
                            transition: 'transform 0.3s ease-in-out'
                          }}
                          title={gameState.canDraw ? 'Click to draw from deck' : ''}
                        >
                          <svg className="mb-1" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <rect x="4" y="4" width="16" height="16" rx="2" />
                          </svg>
                          <div className="text-xs">{gameState.deckSize}</div>
                        </div>
                      </div>
                    </div>

                    {/* Goal Text */}
                    <div className="text-xs bg-blue-50 px-3 py-1 rounded text-center max-w-[200px]">
                      <strong>Goal:</strong> {roundRequirements[gameState.currentRound].description}
                    </div>
                  </div>

                  {/* Sound Controls and How to Play Button - Top Right */}
                  <div className="col-start-3 row-start-1 flex items-start justify-end gap-3 p-4 mobile-order-5">
                    {/* Sound Controls */}
                    <div className="bg-white/90 backdrop-blur px-3 py-2 rounded shadow-lg flex items-center gap-2">
                      {/* Mute Button */}
                      <button
                        onClick={() => setIsMuted(!isMuted)}
                        className="text-2xl hover:scale-110 transition-transform"
                        title={isMuted ? 'Unmute' : 'Mute'}
                      >
                        {isMuted ? '🔇' : '🔊'}
                      </button>

                      {/* Volume Slider */}
                      <div className="flex items-center gap-2">
                        <input
                          type="range"
                          min="0"
                          max="1"
                          step="0.1"
                          value={volume}
                          onChange={(e) => setVolume(parseFloat(e.target.value))}
                          className="w-20 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                          title="Volume"
                          disabled={isMuted}
                        />
                        <span className="text-xs text-gray-600 w-8">{Math.round(volume * 100)}%</span>
                      </div>
                    </div>

                    {/* How to Play Button */}
                    <button
                      onClick={() => setShowHowToPlay(true)}
                      className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 shadow-lg"
                    >
                      📖 How to Play
                    </button>
                  </div>

                  {gameState.players.map((player, idx) => {
                    const isCurrentPlayer = idx === gameState.currentPlayerIndex;
                    const isMe = player.isMe;
                    const buysRemaining = gameState.maxBuys - (player.buyCount || 0);

                    // Find my index to arrange others clockwise relative to me
                    const myIndex = gameState.players.findIndex(p => p.isMe);

                    // Calculate clockwise position:
                    // TRUE CLOCKWISE (like a clock face): 0 (me/bottom) = 6 o'clock, 1 = 9 o'clock (left), 2 = 12 o'clock (top), 3 = 3 o'clock (right)
                    const relativePosition = (idx - myIndex + gameState.players.length) % gameState.players.length;

                    // Grid position styles based on TRUE CLOCKWISE arrangement
                    let gridPosition = '';
                    if (relativePosition === 0) {
                      // Me - bottom center (6 o'clock) (row 3, col 2) - directly above discard and hand sections
                      gridPosition = 'col-start-2 row-start-3';
                    } else if (relativePosition === 1) {
                      // LEFT player - clockwise next from me (9 o'clock) (row 2, col 1)
                      gridPosition = 'col-start-1 row-start-2';
                    } else if (relativePosition === 2) {
                      // TOP player - across from me (12 o'clock) (row 1, col 2)
                      gridPosition = 'col-start-2 row-start-1';
                    } else if (relativePosition === 3) {
                      // RIGHT player - clockwise before me (3 o'clock) (row 2, col 3)
                      gridPosition = 'col-start-3 row-start-2';
                    }

                    const hasBuyPriority = gameState.nextPlayerToBuy === player.id;

                    return (
                      <div
                        key={player.id}
                        className={`${gridPosition} rounded-lg p-4 transition-all player-info-box ${
                          isCurrentPlayer
                            ? 'bg-blue-100 ring-4 ring-blue-500'
                            : hasBuyPriority
                            ? 'bg-purple-50 ring-4 ring-purple-500'
                            : 'bg-white'
                        }`}
                      >
                        <div className="flex justify-between items-start mb-3">
                          <h3 className="font-bold text-lg">
                            {player.name}
                            {hasBuyPriority && (
                              <span className="ml-2 text-xs bg-purple-600 text-white px-2 py-1 rounded-full">
                                BUY PRIORITY
                              </span>
                            )}
                          </h3>
                          <div className="text-right text-sm score-info">
                            <div>Remaining Buys: {buysRemaining}</div>
                          </div>
                        </div>

                        {/* Player's hand (cards for human, card backs for AI) */}
                        <div className={`mb-2 ${isMe ? 'player-hand-section' : ''}`}>
                          <div className="text-sm font-semibold mb-1">
                            Hand: {player.handSize} card{player.handSize !== 1 ? 's' : ''}
                            {isMe && player.handSize > 0 && (
                              <span className="text-xs text-gray-500 font-normal ml-2">- See "Your Hand" section below</span>
                            )}
                          </div>
                          {!isMe && (
                            <div className="flex flex-wrap gap-1">
                              {/* Show card backs for AI players (hidden on mobile via CSS) */}
                              <div className="player-card-backs flex flex-wrap gap-1">
                                {Array.from({ length: player.handSize }).map((_, cardIdx) => (
                                  <div
                                    key={cardIdx}
                                    className="bg-blue-900 border border-gray-800 rounded w-8 h-12 flex items-center justify-center"
                                  >
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                      <rect x="4" y="4" width="16" height="16" rx="2" />
                                    </svg>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>

                        {/* Player's melds */}
                        <div>
                          <div className="text-sm font-semibold mb-1">Melds:</div>
                          {player.melds.length === 0 ? (
                            <div className="text-xs text-gray-400">None</div>
                          ) : (
                            <div className="space-y-2 max-h-80 overflow-y-auto player-melds">
                              {player.melds.map((meld, meldIdx) => {
                                const isCompatible = layoffMode && selectedCards.length === 1;
                                const isMeldAnimating = player.isMe && animatingMeldIndex === meldIdx;
                                const isLayoffTarget = animatingLayoffMeld &&
                                  animatingLayoffMeld.ownerId === player.id &&
                                  animatingLayoffMeld.meldIndex === meldIdx;

                                const isDragTarget = dragOverMeld?.playerId === player.id && dragOverMeld?.meldIndex === meldIdx;
                                const canAcceptDrop = gameState.isMyTurn && gameState.hasMetRequirements && gameState.gamePhase !== 'draw' && draggedCardId;

                                return (
                                  <div
                                    key={meldIdx}
                                    onClick={() => {
                                      if (layoffMode && isCompatible) {
                                        completeLayoff(player.id, meldIdx);
                                      }
                                    }}
                                    onDragOver={(e) => handleMeldDragOver(e, player.id, meldIdx)}
                                    onDragEnter={(e) => handleMeldDragEnter(e, player.id, meldIdx)}
                                    onDragLeave={handleMeldDragLeave}
                                    onDrop={(e) => handleMeldDrop(e, player.id, meldIdx)}
                                    className={`border rounded p-2 text-xs ${
                                      layoffMode && isCompatible
                                        ? 'border-green-500 bg-green-50 cursor-pointer hover:bg-green-100'
                                        : isDragTarget && canAcceptDrop
                                          ? 'border-green-500 bg-green-100 ring-4 ring-green-400'
                                          : 'border-gray-300'
                                    } ${isMeldAnimating ? 'meld-snap' : ''} ${isLayoffTarget ? 'meld-pulse' : ''}`}
                                    title={draggedCardId && canAcceptDrop ? 'Drop to layoff card' : ''}
                                  >
                                    <div className="font-semibold mb-1 capitalize">
                                      {meld.type}
                                    </div>
                                    <div className="flex flex-wrap gap-1">
                                      {meld.cards.map(card => (
                                        <div
                                          key={card.id}
                                          onClick={() => {
                                            if (wildcardReplaceMode && card.isWild &&
                                                selectedMeld && selectedMeld.ownerId === player.id &&
                                                selectedMeld.meldIndex === meldIdx) {
                                              setSelectedWildcard(card.id);
                                            }
                                          }}
                                          className={`bg-white border rounded px-1 py-0.5 text-center meld-card-mobile ${
                                            wildcardReplaceMode && card.isWild &&
                                            selectedMeld && selectedMeld.ownerId === player.id &&
                                            selectedMeld.meldIndex === meldIdx
                                              ? selectedWildcard === card.id
                                                ? 'border-blue-500 bg-blue-100 cursor-pointer'
                                                : 'border-purple-500 bg-purple-50 cursor-pointer'
                                              : 'border-gray-800'
                                          }`}
                                        >
                                          <div className={`text-sm font-bold ${getCardColor(card.suit)}`}>
                                            {card.rank}{card.suit}
                                          </div>
                                          {card.isWild && <div className="text-xs text-purple-600">W</div>}
                                        </div>
                                      ))}
                                    </div>

                                    {/* Wildcard replacement controls */}
                                    {wildcardReplaceMode && selectedMeld &&
                                     selectedMeld.ownerId === player.id &&
                                     selectedMeld.meldIndex === meldIdx && (
                                      <div className="mt-2 flex gap-1 flex-wrap">
                                        <button
                                          onClick={() => replaceWildcard(selectedWildcard, 'beginning')}
                                          disabled={!selectedWildcard}
                                          className="bg-blue-600 text-white px-2 py-0.5 rounded text-xs hover:bg-blue-700 disabled:bg-gray-300"
                                        >
                                          Move to Start
                                        </button>
                                        <button
                                          onClick={() => replaceWildcard(selectedWildcard, 'end')}
                                          disabled={!selectedWildcard}
                                          className="bg-blue-600 text-white px-2 py-0.5 rounded text-xs hover:bg-blue-700 disabled:bg-gray-300"
                                        >
                                          Move to End
                                        </button>
                                        <button
                                          onClick={addToRunNormally}
                                          className="bg-green-600 text-white px-2 py-0.5 rounded text-xs hover:bg-green-700"
                                        >
                                          Add Normal
                                        </button>
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Discard pile and deck */}
                <div className="bg-white rounded-lg shadow-lg p-6 mb-4 discard-section mobile-order-1">
                  <h2 className="text-xl font-bold mb-3">Discard Pile & Actions</h2>
                  <div className="flex gap-4 items-start">
                    {/* Discard pile and deck */}
                    <div className="flex gap-2">
                      {gameState.discardPile.length > 0 ? (
                        <div className="relative">
                          <div
                            onClick={gameState.canTakeDiscard ? takeDiscard : undefined}
                            onDragOver={handleDiscardDragOver}
                            onDragEnter={handleDiscardDragEnter}
                            onDragLeave={handleDiscardDragLeave}
                            onDrop={handleDiscardDrop}
                            className={`bg-white border-2 rounded p-3 w-20 text-center ${
                              gameState.canTakeDiscard ? 'cursor-pointer hover:bg-gray-100 ring-2 ring-blue-500' : 'opacity-50 cursor-not-allowed'
                            } ${
                              dragOverDiscard ? 'ring-4 ring-red-500 border-red-500 scale-105' : 'border-gray-800'
                            }`}
                            title={draggedCardId ? 'Drop to discard' : (gameState.canTakeDiscard ? 'Click to take discard' : '')}
                          >
                            <div className={`text-2xl font-bold ${getCardColor(gameState.discardPile[gameState.discardPile.length - 1].suit)}`}>
                              {gameState.discardPile[gameState.discardPile.length - 1].rank}
                            </div>
                            <div className={`text-xl ${getCardColor(gameState.discardPile[gameState.discardPile.length - 1].suit)}`}>
                              {gameState.discardPile[gameState.discardPile.length - 1].suit}
                            </div>
                          </div>
                          {/* Buy request badge */}
                          {gameState.buyRequests && gameState.buyRequests.length > 0 && (
                            <div className="absolute -top-2 -right-2 bg-purple-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shadow-lg ring-2 ring-purple-300 animate-pulse">
                              {gameState.buyRequests.length}
                            </div>
                          )}
                        </div>
                      ) : (
                        <div
                          onDragOver={handleDiscardDragOver}
                          onDragEnter={handleDiscardDragEnter}
                          onDragLeave={handleDiscardDragLeave}
                          onDrop={handleDiscardDrop}
                          className={`w-20 h-28 flex items-center justify-center border-2 border-dashed rounded ${
                            dragOverDiscard ? 'border-red-500 bg-red-50 ring-4 ring-red-400' : 'border-gray-300 text-gray-400'
                          }`}
                          title={draggedCardId ? 'Drop to discard' : ''}
                        >
                          Empty
                        </div>
                      )}
                      <div
                        onClick={gameState.canDraw ? drawCard : undefined}
                        className={`bg-blue-900 text-white rounded p-3 w-20 text-center flex flex-col items-center justify-center ${
                          gameState.canDraw ? 'cursor-pointer hover:bg-blue-800 ring-2 ring-blue-500' : 'opacity-50 cursor-not-allowed'
                        }`}
                      >
                        <svg className="mb-1" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                          <rect x="4" y="4" width="16" height="16" rx="2" />
                        </svg>
                        <div className="text-xs">Deck ({gameState.deckSize})</div>
                      </div>
                    </div>

                    {/* Buy controls - ALWAYS VISIBLE */}
                    <div className="flex-1">
                      <div className="text-sm font-semibold mb-2">Buy Actions:</div>
                      <div className="flex gap-2 flex-wrap buy-actions">
                        {/* Request Buy button */}
                        <button
                          onClick={requestBuy}
                          disabled={gameState.isMyTurn || !gameState.canBuy || gameState.hasBuyRequest || gameState.gamePhase !== 'draw' || gameState.discardPile.length === 0}
                          className={`px-4 py-2 rounded transition-all ${
                            !gameState.isMyTurn && gameState.canBuy && !gameState.hasBuyRequest && gameState.gamePhase === 'draw' && gameState.discardPile.length > 0
                              ? 'bg-purple-600 text-white hover:bg-purple-700 cursor-pointer'
                              : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                          }`}
                        >
                          Request Buy ({gameState.maxBuys - gameState.myBuyCount} left)
                        </button>

                        {/* Cancel Buy button */}
                        <button
                          onClick={cancelBuy}
                          disabled={!gameState.hasBuyRequest}
                          className={`px-4 py-2 rounded transition-all ${
                            gameState.hasBuyRequest
                              ? 'bg-gray-600 text-white hover:bg-gray-700 cursor-pointer'
                              : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                          }`}
                        >
                          Cancel Buy
                        </button>

                        {/* Pass button with countdown */}
                        <button
                          onClick={passBuy}
                          disabled={!gameState.shouldShowPass || gameState.hasPassed}
                          className={`px-4 py-2 rounded transition-all ${
                            gameState.shouldShowPass && !gameState.hasPassed
                              ? 'bg-orange-600 text-white hover:bg-orange-700 cursor-pointer'
                              : gameState.hasPassed
                              ? 'bg-green-500 text-white cursor-not-allowed'
                              : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                          }`}
                        >
                          {gameState.hasPassed
                            ? '✓ Passed'
                            : `Pass${buyCountdown ? ` (${buyCountdown}s)` : ''}`
                          }
                        </button>
                      </div>

                      {/* Buy status info */}
                      {gameState.buyRequests && gameState.buyRequests.length > 0 && (
                        <div className="mt-2 text-sm bg-purple-100 px-3 py-2 rounded buy-status border-l-4 border-purple-600">
                          <div className="font-semibold text-purple-900">
                            {gameState.buyRequests.length} player(s) want to buy
                          </div>
                          {gameState.nextPlayerToBuy && (
                            <div className="text-purple-700 mt-1">
                              Priority: <strong>{gameState.players.find(p => p.id === gameState.nextPlayerToBuy)?.name || 'Unknown'}</strong>
                              {' '}(closest in turn order)
                            </div>
                          )}
                          <div className="text-purple-600 text-xs mt-1">
                            All players between current player and buyer must pass
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                {/* My hand */}
                <div className="bg-white rounded-lg shadow-lg p-6 mb-4 hand-section mobile-order-2">
                  <div className="flex justify-between items-center mb-3">
                    <h2 className="text-xl font-bold">Your Hand ({gameState.myHand.length} cards) - Drag to reorder</h2>
                    <div className="flex gap-2 sort-buttons">
                      <button
                        onClick={sortHandBySuit}
                        className="px-3 py-1 bg-purple-600 text-white text-sm rounded hover:bg-purple-700 transition-all"
                        title="Sort cards by suit, then by value within each suit"
                      >
                        Sort by Suit
                      </button>
                      <button
                        onClick={sortHandByValue}
                        className="px-3 py-1 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition-all"
                        title="Sort cards by value (lowest to highest)"
                      >
                        Sort by Value
                      </button>
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-1 min-h-[120px]">
                    {gameState.myHand.map((card, index) => (
                      <div
                        key={card.id}
                        className="relative flex items-center"
                      >
                        {/* Drop indicator - shows on left side of card */}
                        {dragOverCardId === card.id && draggedCardId !== card.id && (
                          <div
                            className="absolute -left-1 top-0 bottom-0 w-1 bg-blue-500 rounded-full z-10 drop-indicator-mobile"
                            style={{boxShadow: '0 0 8px rgba(59, 130, 246, 0.8)'}}
                          />
                        )}
                        <div
                          draggable
                          data-card-id={card.id}
                          onDragStart={(e) => handleDragStart(e, card.id)}
                          onDragOver={(e) => handleDragOver(e, card.id)}
                          onDragEnter={(e) => handleDragEnter(e, card.id)}
                          onDragLeave={handleDragLeave}
                          onDragEnd={handleDragEnd}
                          onDrop={(e) => handleDrop(e, card.id)}
                          onClick={() => {
                            // Don't toggle if this was actually a drag operation
                            if (!isDragging) {
                              toggleCardSelection(card.id);
                            }
                          }}
                          onTouchStart={(e) => handleCardTouchStart(e, card.id)}
                          onTouchMove={(e) => handleCardTouchMove(e, card.id)}
                          onTouchEnd={(e) => handleCardTouchEnd(e, card.id)}
                          onContextMenu={(e) => {
                            e.preventDefault();
                            handleCardTap(card);
                          }}
                          className={`bg-white border-2 rounded p-3 w-20 h-24 text-center cursor-move transition-all select-none relative card-mobile ${
                            selectedCards.includes(card.id)
                              ? 'border-blue-500 bg-blue-50 transform -translate-y-2'
                              : dragOverCardId === card.id && (draggedCardId !== card.id || touchDraggedCardId !== card.id)
                                ? 'border-blue-400 bg-blue-50'
                                : 'border-gray-800 hover:bg-gray-50'
                          } ${(draggedCardId === card.id || touchDraggedCardId === card.id) ? 'opacity-50 scale-95' : ''} ${newCardIds.has(card.id) ? 'card-deal' : ''}`}
                        >
                          <div className={`text-2xl font-bold rank-text ${getCardColor(card.suit)}`}>
                            {card.rank}
                          </div>
                          <div className={`text-xl suit-text ${getCardColor(card.suit)}`}>
                            {card.suit}
                          </div>
                          {card.isWild && (
                            <div className="absolute bottom-1 left-0 right-0 text-xs text-purple-600 font-bold">WILD</div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="mt-4">
                    <div className="text-sm font-semibold mb-2">Hand Actions:</div>
                    <div className="flex gap-2 flex-wrap hand-actions">
                      <button
                        onClick={() => createMeld('set')}
                        disabled={!gameState.isMyTurn || gameState.gamePhase === 'draw'}
                        className={`px-4 py-2 rounded transition-all ${
                          gameState.isMyTurn && gameState.gamePhase !== 'draw'
                            ? 'bg-green-600 text-white hover:bg-green-700 cursor-pointer'
                            : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                        }`}
                      >
                        Create Set
                      </button>
                      <button
                        onClick={() => createMeld('run')}
                        disabled={!gameState.isMyTurn || gameState.gamePhase === 'draw'}
                        className={`px-4 py-2 rounded transition-all ${
                          gameState.isMyTurn && gameState.gamePhase !== 'draw'
                            ? 'bg-purple-600 text-white hover:bg-purple-700 cursor-pointer'
                            : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                        }`}
                      >
                        Create Run
                      </button>
                      <button
                        onClick={layoffCard}
                        disabled={!gameState.isMyTurn || !gameState.hasMetRequirements || gameState.gamePhase === 'draw'}
                        className={`px-4 py-2 rounded transition-all ${
                          gameState.isMyTurn && gameState.hasMetRequirements && gameState.gamePhase !== 'draw'
                            ? 'bg-orange-600 text-white hover:bg-orange-700 cursor-pointer'
                            : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                        }`}
                      >
                        Layoff Card {!gameState.hasMetRequirements && '(Complete melds first)'}
                      </button>
                      <button
                        onClick={cancelMelds}
                        disabled={!gameState.isMyTurn || gameState.gamePhase === 'draw' || !gameState.myMelds || gameState.myMelds.length === 0 || gameState.hasMetRequirements}
                        className={`px-4 py-2 rounded transition-all ${
                          gameState.isMyTurn && gameState.gamePhase !== 'draw' && gameState.myMelds && gameState.myMelds.length > 0 && !gameState.hasMetRequirements
                            ? 'bg-yellow-600 text-white hover:bg-yellow-700 cursor-pointer'
                            : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                        }`}
                      >
                        Cancel Melding
                      </button>
                      <button
                        onClick={discard}
                        disabled={!gameState.isMyTurn || gameState.gamePhase === 'draw'}
                        className={`px-4 py-2 rounded transition-all ${
                          gameState.isMyTurn && gameState.gamePhase !== 'draw'
                            ? 'bg-red-600 text-white hover:bg-red-700 cursor-pointer'
                            : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                        }`}
                      >
                        Discard Selected
                      </button>
                    </div>
                  </div>
                </div>

                {/* Player Scores Section - Shows all players' scores and rounds won */}
                <div className="bg-white rounded-lg shadow-lg p-6 mb-4 scores-section mobile-order-4">
                  <h2 className="text-xl font-bold mb-3">Player Scores</h2>
                  <div className="space-y-2">
                    {gameState.players.map((player, idx) => {
                      const isMe = player.isMe;
                      return (
                        <div
                          key={player.id}
                          className={`rounded p-3 score-player ${
                            isMe
                              ? 'bg-blue-100 border-2 border-blue-500'
                              : 'bg-gray-50 border border-gray-300'
                          }`}
                        >
                          <div className="flex justify-between items-center">
                            <div className="font-bold">{player.name}{isMe ? ' (You)' : ''}</div>
                            <div className="flex gap-4">
                              <div className="text-sm">
                                <span className="text-gray-600">Score:</span>{' '}
                                <strong className="text-lg">{player.score}</strong>
                              </div>
                              <div className="text-sm">
                                <span className="text-gray-600">Rounds Won:</span>{' '}
                                <strong className="text-lg">{player.roundsWon || 0}</strong>
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
                </div>
              </div>
            </>
          );
        }

        ReactDOM.render(<HawaiianRummyMultiplayer />, document.getElementById('root'));
    </script>
</body>
</html>
